[project]
name = "ravebear-monolith"
version = "0.1.0"
description = "Unified Trading Intelligence System"
authors = [{ name = "RaveBear" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "ravebear_monolith", from = "src" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = [
    "01_*",
    "02_*",
    "03_*",
    "04_*",
    "05_*",
    "06_*",
    "07_*",
    "08_*",
    "09_*",
    "10_*",
    "_DOCS",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
